apiVersion: v1
kind: Service
metadata:
  name: {{ include "replica-control.name" . }}
  labels:
    {{- include "replica-control.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "replica-control.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
# The unauthenticated health port is deliberately NOT exposed through the Service.
