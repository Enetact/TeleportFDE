level: 5
replicaCount: 2
image:
  repository: replica-control
  tag: dev
  pullPolicy: IfNotPresent
service:
  port: 8443
tls:
  existingSecret: replica-control-tls
  allowedClientURI: spiffe://replica-control.local/client/operator
  # Change after replacing certificates to trigger a rolling restart.
  rolloutToken: "0"
leaderElection:
  enabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
# Test-only value that changes the Pod template without changing API behavior.
rolloutToken: "0"
