name: reference-ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cluster_tests:
        description: Run all five levels and both rollout tests in ephemeral KIND clusters
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: bash scripts/check-format.sh
      - run: make test vet build
      - name: Require the dependency lock and generated code to be committed
        run: |
          git ls-files --error-unmatch go.sum gen/replicas/v1/replicas.pb.go gen/replicas/v1/replicas_grpc.pb.go
          git diff --exit-code -- go.mod go.sum gen/
  integration:
    needs: unit
    if: github.event_name == 'workflow_dispatch' && inputs.cluster_tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        level: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: 'v3.19.0'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler jq
          go install sigs.k8s.io/kind@v0.31.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 -o kubectl https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 -o kubectl.sha256 https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - run: make helm-check integration LEVEL=${{ matrix.level }}
      - name: Probe rolling availability
        if: matrix.level >= 4
        run: make upgrade-test LEVEL=${{ matrix.level }}
      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-sre-reference get pods -A -o wide || true
          kubectl --context kind-sre-reference -n replica-system logs deployment/replica-control --tail=200 || true
      - name: Remove development cluster
        if: always()
        run: make clean-cluster
