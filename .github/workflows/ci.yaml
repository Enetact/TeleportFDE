name: development-ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      cluster_tests:
        description: Full container and KIND checks (main and version tags always run full)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Unrelated label edits must neither restart nor cancel an active PR test run.
  # Removing ci:full shares the PR's normal group and cancels obsolete work.
  group: development-ci-${{ github.event_name }}-${{ github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && format('label-{0}', github.event.label.name) || 'checks' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  policy:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.select.outputs.quality }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select checks for this event
        id: select
        run: python3 scripts/ci-policy.py
  quality:
    needs: policy
    if: needs.policy.outputs.quality == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned development tools
        run: bash scripts/setup-dev.sh
      - name: Validate source, generated files, chart and workflows
        run: bash scripts/dev.sh quality vuln
      - name: Test and build the complete container
        if: needs.policy.outputs.full == 'true'
        run: bash scripts/dev.sh docker-test docker-build
      - name: Package development artifacts for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/dev.sh package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: development-package-${{ github.ref_name }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
  integration:
    needs: [policy, quality]
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/setup-dev.sh
      - run: bash scripts/dev.sh integration LEVEL=${{ matrix.level }}
      - name: Probe rolling availability
        if: matrix.level >= 3
        run: bash scripts/dev.sh upgrade-test LEVEL=${{ matrix.level }}
      - name: Diagnostics
        if: failure()
        run: |
          source scripts/dev-env.sh
          diagnostic_dir="artifacts/integration/level-${{ matrix.level }}/workflow"
          mkdir -p "$diagnostic_dir"
          kubectl --context kind-sre-reference get pods -A -o wide > "$diagnostic_dir/pods.log" 2>&1 || true
          kubectl --context kind-sre-reference -n replica-system logs -l app.kubernetes.io/instance=replica-control --all-containers --prefix --tail=200 > "$diagnostic_dir/application.log" 2>&1 || true
          kubectl --context kind-sre-reference get events -A --sort-by=.metadata.creationTimestamp > "$diagnostic_dir/events.log" 2>&1 || true
          cat "$diagnostic_dir"/*.log
      - name: Retain integration diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-level-${{ matrix.level }}-${{ github.run_attempt }}
          # Only harness logs are eligible; never upload .local/pki or Secrets.
          path: artifacts/integration/level-${{ matrix.level }}/**/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Remove the job's disposable development cluster
        if: always()
        run: bash scripts/dev.sh clean-cluster
